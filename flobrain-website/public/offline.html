<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FloBrain is offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #070014; color: #e2e8f0; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 1.5rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { color: #94a3b8; line-height: 1.5; }
      button { margin-top: 1rem; background: #a855f7; color: #fff; border: 0; border-radius: .6rem; padding: .6rem 1rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Messages you write in a room are kept on this device and sent when you're back online. Reconnect to load new pages.</p>
      <p dir="rtl" lang="ar">أنت غير متصل. الرسائل التي تكتبها تُحفظ على هذا الجهاز وتُرسل عند عودة الاتصال.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
