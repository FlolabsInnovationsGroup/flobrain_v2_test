name: Website CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-website/**'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-website/**'

defaults:
  run:
    working-directory: ./flobrain-website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: flobrain-website/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Unit tests
      # Full Vitest suite still has pre-existing V1 failures; run V2 + axios slice.
      run: npm test -- --run src/lib/axios.test.ts src/lib/axios.interceptor.test.ts src/i18n src/lib/v2 src/components/v2 src/app/w

    - name: Build
      env:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      run: npm run build

  playwright:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: flobrain-website/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright
      run: npx --yes playwright@1.56.1 install --with-deps chromium
    - name: Run Playwright skeleton
      run: npx --yes playwright@1.56.1 test
      env:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
